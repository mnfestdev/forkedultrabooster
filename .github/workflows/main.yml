name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip source code
      run: |
        if [ -f *.zip ]; then
          unzip *.zip
          rm *.zip # Удаляем сам архив, чтобы он не мешал поиску
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build Project
      run: |
        # Ищем файл gradlew в подпапках
        GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Ошибка: Скрипт сборки gradlew не найден!"
          exit 1
        fi
        
        # Переходим в папку с проектом
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        
        echo "Проект найден в папке: $PROJECT_DIR"
        
        # Запускаем сборку
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
