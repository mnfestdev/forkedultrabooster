name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip source code
      run: |
        if [ -f *.zip ]; then
          unzip *.zip
          rm *.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Missing Gradle Wrapper and Build
      run: |
        # Ищем папку, в которой лежит файл build.gradle или build.gradle.kts
        BUILD_FILE_PATH=$(find . -name "build.gradle*" -not -path "*/.*" | head -n 1)
        
        if [ -z "$BUILD_FILE_PATH" ]; then
          echo "Ошибка: В архиве не найден файл build.gradle! Проверьте структуру архива."
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$BUILD_FILE_PATH")
        cd "$PROJECT_DIR"
        
        echo "Проект Android найден в папке: $PROJECT_DIR"
        
        # Если файла gradlew нет, генерируем его стандартной командой gradle wrapper
        if [ ! -f "gradlew" ]; then
          echo "Файл gradlew не найден. Устанавливаем Gradle Wrapper..."
          gradle wrapper --gradle-version 8.0 # Создаем недостающий скрипт сборки
        fi
        
        # Запускаем сборку APK
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
